name: Weekly Bundle Automator

on:
  schedule:
    # 매주 월요일 KST 07:00 (UTC 일요일 22:00)
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  bundle-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore Secret Files
        env:
          SECRET_ENV: ${{ secrets.ENV_FILE }}
          SECRET_CLIENT: ${{ secrets.CLIENT_SECRETS_JSON }}
          SECRET_TOKEN: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$SECRET_ENV" > .env
          echo "$SECRET_CLIENT" > client_secrets.json
          echo "$SECRET_TOKEN" > token.json
          mkdir -p data

      - name: Download Weekly Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GitHub Release 서버에서 이번 주 에셋들을 로드합니다..."
          # 만약 릴리즈가 없으면 실패하는 것을 무시하고 진행
          gh release download weekly-assets -D data/ || echo "다운로드할 파일이 (아직) 없습니다."

      - name: Run Weekly Compiler
        run: |
          python -m src.weekly_compiler

      - name: Purge Weekly Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "에셋 저장소 파일을 모두 삭제하여 다음 주를 위해 초기화합니다."
          # weekly-assets 릴리즈 자체를 삭제했다가 다시 빈 껍데기로 생성
          gh release delete weekly-assets --cleanup-tag -y || echo "삭제할 릴리즈가 없습니다."
          gh release create weekly-assets --title "Weekly Assets" --notes "Temporary storage for weekly bundle"
