name: Daily YouTube Shorts Automator

on:
  schedule:
    # 매일 4시간 간격으로 자동 실행 (UTC 0, 4, 8, 12, 16, 20)
    - cron: '0 */4 * * *'
  workflow_dispatch: # GitHub 페이지에서 수동으로 실행 버튼 활성화

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements.txt if it exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore Secret Files
        env:
          SECRET_ENV: ${{ secrets.ENV_FILE }}
          SECRET_CLIENT: ${{ secrets.CLIENT_SECRETS_JSON }}
          SECRET_TOKEN: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$SECRET_ENV" > .env
          echo "$SECRET_CLIENT" > client_secrets.json
          echo "$SECRET_TOKEN" > token.json

      - name: Run Main Pipeline
        run: |
          python main.py

      - name: Archive Daily Video for Weekly Bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create weekly-assets release if it doesn't exist
          gh release view weekly-assets || gh release create weekly-assets --title "Weekly Assets" --notes "Temporary storage for weekly bundle"
          
          # Rename output_shorts.mp4 to something unique
          TIMESTAMP=$(date +'%Y%m%d_%H%M')
          if [ -f data/output_shorts.mp4 ]; then
            mv data/output_shorts.mp4 data/music_${TIMESTAMP}.mp4
            gh release upload weekly-assets data/music_${TIMESTAMP}.mp4 --clobber
          else
            echo "No output_shorts.mp4 found."
          fi

      - name: Update Env Secret (Session Persistence)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .env ]; then
            # .env 파일에 갱신된 SUNO_COOKIE가 포함되어 있으므로 이를 GitHub Secrets에 다시 저장합니다.
            # GITHUB_TOKEN이 secrets:write 권한이 없을 경우 GH_PAT를 설정해야 할 수도 있습니다.
            gh secret set ENV_FILE < .env
            echo "Successfully updated ENV_FILE secret."
          else
            echo ".env file not found, skipping secret update."
          fi