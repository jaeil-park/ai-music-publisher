name: Daily YouTube Shorts Automator

on:
  schedule:
    # 매일 UTC 00:00, 09:00 (한국 시간 오전 9시, 오후 6시)에 자동 실행
    - cron: '0 0,9 * * *'
  workflow_dispatch: # GitHub 페이지에서 수동으로 실행 버튼 활성화

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai curl_cffi ffmpeg-python google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv

      - name: Restore Secret Files
        env:
          SECRET_ENV: ${{ secrets.ENV_FILE }}
          SECRET_CLIENT: ${{ secrets.CLIENT_SECRETS_JSON }}
          SECRET_TOKEN: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$SECRET_ENV" > .env
          echo "$SECRET_CLIENT" > client_secrets.json
          echo "$SECRET_TOKEN" > token.json

      - name: Run Main Pipeline
        run: |
          python main.py