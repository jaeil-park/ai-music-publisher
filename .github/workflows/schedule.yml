name: Daily YouTube Shorts Automator

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 9시)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 페이지에서 수동으로 실행 버튼 활성화

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Secret Files
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Run Main Pipeline
        run: |
          python main.py